<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="cm-caja-web" content="ControlMaster · Caja">
<title>Caja · ControlMaster</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="top">
  <div class="top-tit" id="tTit">Caja<small id="tSub">ControlMaster</small></div>
  <div class="flex1"></div>
  <button type="button" class="pill" id="btnSistema" onclick="irSistema(this)" title="Abrir el menú del sistema">🏠 Sistema</button>
  <button type="button" class="pill turno oculto" id="pillTurno" onclick="irCierre()" title="Cerrar turno">🧾 <span id="turnoNom"></span></button>
  <button type="button" class="pill" id="pillEstado" onclick="irA('ventas')"><span class="dot"></span><span id="pillTxt">Revisando…</span></button>
  <nav class="nav" id="nav">
    <button type="button" data-v="vender" class="on" onclick="irA('vender')">🛒 Vender</button>
    <button type="button" data-v="ventas" onclick="irA('ventas')">🧾 Ventas</button>
    <button type="button" data-v="ajustes" onclick="irA('ajustes')">⚙️</button>
    <button type="button" id="btnTema" title="Tema claro / oscuro" onclick="cambiarTema()">☀️</button>
  </nav>
</header>
<div class="tasabar" id="tasaBar"></div>
<div id="banners"></div>

<!-- ENTRAR: activar el equipo, usuario y clave, descargar datos -->
<section class="vista" id="vActivar">
  <div class="activar card" style="margin:24px 12px;">
    <div style="font-size:44px;" id="actIco">🧾</div>
    <h1 id="actTit">Caja</h1>
    <div id="actTxt"><p><span class="sp"></span>Abriendo…</p></div>
    <div id="actForm" class="act-form"></div>
    <div id="actBtns" style="margin-top:12px;"></div>
  </div>
</section>

<!-- VENDER -->
<section class="vista" id="vVender">
  <div class="wrap">
    <div class="venta-grid">
      <div class="card">
        <div class="card-tit">🔎 Productos</div>
        <input class="inp" id="busca" type="search" placeholder="Código, código de barras o nombre" autocomplete="off" oninput="buscar()" onkeydown="if(event.key==='Enter'){event.preventDefault();buscarEnter();}">
        <div class="lista-prod" id="listaProd"></div>
      </div>
      <div class="card">
        <div class="card-tit">🧾 Venta <span class="flex1"></span><button type="button" class="btn sm" id="btnLimpiar" onclick="limpiarVentaConfirmar()">🗑️ Vaciar</button></div>
        <div class="fila-cli">
          <button type="button" class="chipbtn" id="btnCliente" onclick="abrirClientes()">👤 <span id="cliNom">Genérico</span></button>
          <select class="inp" id="selVend" style="width:auto;flex:1;min-width:150px;" onchange="F.vend=this.value"></select>
          <span class="chipbtn oculto" id="badgeVend"></span>
          <select class="inp" id="selTipoPrecio" style="width:auto;" onchange="cambiarTipoPrecio(this.value)"></select>
        </div>
        <div id="lineas"></div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn sm" id="btnDesc" onclick="abrirDescuento()">🏷️ Descuento</button>
        </div>
        <div class="tot" id="totales"></div>
        <div class="barra-cobro">
          <div class="t" id="barraTot">Bs 0,00<small>$0,00 BCV</small></div>
          <div class="flex1"></div>
          <button type="button" class="btn green" id="btnCobrar" onclick="abrirPago()" style="min-width:140px;font-size:16px;">💳 Cobrar</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- TURNO: ¿quién está en la caja? -->
<section class="vista" id="vTurno">
  <div class="wrap">
    <div class="card turno-card">
      <div class="card-tit">🧾 Abrir turno</div>
      <div id="turnoCuerpo"></div>
    </div>
  </div>
</section>

<!-- CIERRE DE TURNO -->
<section class="vista" id="vCierre">
  <div class="wrap" style="max-width:640px;">
    <div class="card" id="cierreCard"></div>
  </div>
</section>

<!-- VENTAS DEL EQUIPO -->
<section class="vista" id="vVentas">
  <div class="wrap">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
      <button type="button" class="btn green" id="btnSubir" onclick="subirAhora(this)">⬆️ Subir ahora</button>
      <button type="button" class="btn" onclick="descargarRespaldo()">💾 Descargar respaldo</button>
    </div>
    <div class="res" id="resumen"></div>
    <div id="porCajero"></div>
    <div id="turnosLista"></div>
    <div class="filtros" id="filtros">
      <button type="button" class="btn sm on" data-f="hoy" onclick="filtrarVentas('hoy')">Hoy</button>
      <button type="button" class="btn sm" data-f="por" onclick="filtrarVentas('por')">Por subir</button>
      <button type="button" class="btn sm" data-f="mal" onclick="filtrarVentas('mal')">Con problema</button>
      <button type="button" class="btn sm" data-f="av" onclick="filtrarVentas('av')">Con avisos</button>
      <button type="button" class="btn sm" data-f="todas" onclick="filtrarVentas('todas')">Todas</button>
    </div>
    <div id="listaVentas"></div>
  </div>
</section>

<!-- AJUSTES -->
<section class="vista" id="vAjustes">
  <div class="wrap" style="max-width:640px;">
    <div class="card" style="margin-bottom:12px;">
      <div class="card-tit">🖥️ Este equipo</div>
      <div class="kv" id="infoEquipo"></div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn green" id="btnActualizar" onclick="actualizarDatos(this)">🔄 Actualizar datos</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div class="card-tit">👤 Sesión</div>
      <div class="kv" id="infoSesion"></div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn" id="btnSalir" onclick="cerrarSesion(this)">🚪 Cerrar sesión</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div class="card-tit">💱 Tasas para cobrar</div>
      <div class="kv" id="infoTasas"></div>
      <div style="margin-top:12px;"><button type="button" class="btn" onclick="cambiarTasa(this)">🔒 Cambiar tasa</button></div>
    </div>
    <div class="card">
      <div class="card-tit">🖨️ Preferencias</div>
      <label class="lbl" for="selTamTicket" style="margin-top:0;">Tamaño del ticket y del cierre</label>
      <select class="inp" id="selTamTicket" onchange="guardarPref()">
        <option value="auto">Como en Configuración del sistema</option>
        <option value="80">Ticket de 80 mm</option>
        <option value="58">Ticket de 58 mm</option>
        <option value="carta">Hoja carta (impresora normal)</option>
      </select>
      <label class="switch" style="margin-top:6px;"><input type="checkbox" id="chkDosCopias" onchange="guardarPref()"> Imprimir 2 copias del ticket</label>
      <label class="switch"><input type="checkbox" id="chkClaro" onchange="guardarPref()"> Tema claro</label>
      <div style="font-size:12px;color:var(--text-dim);margin-top:8px;" id="verApp"></div>
    </div>
  </div>
</section>

<!-- MODAL PAGO -->
<div class="mfondo oculto" id="mPago">
  <div class="modal ancho">
    <div id="pgForm">
      <div class="pg-head">
        <div><div style="font-size:12px;color:var(--text-dim);font-weight:700;">TOTAL A COBRAR</div><div class="tt" id="pgTotal"></div></div>
        <div class="bs" id="pgTotalBs"></div>
      </div>
      <div class="pg-hint" id="pgHint"></div>
      <div id="pgMetodos"></div>
      <div style="margin-top:6px;" class="oculto" id="pgMas"><button type="button" class="btn sm" onclick="P.verMet=true;pgActualizar()">＋ Otro método</button></div>
      <div id="pgLineas"></div>
      <div id="pgDias" class="oculto">
        <label class="lbl" for="selDias">Días de crédito</label>
        <select class="inp" id="selDias" onchange="P.dias=Number(this.value)||0"></select>
      </div>
      <div id="pgBal"></div>
      <div id="pgVuelto" class="oculto" style="margin-top:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;"><b>💸 Vuelto</b><button type="button" class="btn sm" onclick="pgVueltoCerrar()">Quitar vuelto</button></div>
        <div style="font-size:12px;color:var(--text-dim);margin:4px 0;" id="pgVtSobra"></div>
        <div id="pgVtMetodos"></div>
        <div id="pgVtLineas"></div>
      </div>
      <label class="lbl" for="pgRef">Referencia (opcional)</label>
      <input class="inp" id="pgRef" placeholder="N° de operación, últimos dígitos…" maxlength="60">
      <label class="lbl" for="pgObs">Observaciones (opcional)</label>
      <input class="inp" id="pgObs" placeholder="Se imprimen en el ticket" maxlength="200">
      <div class="m-btns">
        <button type="button" class="btn" id="pgCerrar" onclick="cerrarPago()">Volver</button>
        <button type="button" class="btn green" id="pgGuardar" onclick="pgConfirmar()">✅ Guardar venta</button>
      </div>
    </div>
    <div id="pgOk" class="okpanel oculto">
      <div style="font-size:42px;">✅</div>
      <div class="m-tit">Venta guardada en este equipo</div>
      <div class="num" id="pgOkNum"></div>
      <div class="m-txt" id="pgOkTxt" style="color:var(--text-dim);font-size:13px;"></div>
      <div class="m-btns">
        <button type="button" class="btn" onclick="pgTerminar(false)">Sin imprimir</button>
        <button type="button" class="btn green" onclick="pgTerminar(true)">🖨️ Imprimir ticket</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="api.js"></script>
<script src="sesion.js"></script>
<script src="numeros.js"></script>
</body>
</html>
